name: Backend checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL runtime and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: pythagoras_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pythagoras_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      SECRET_KEY: test-only-ci-key-not-for-deployment-12345678901234567890
      DEBUG: 'true'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://ci:ci-only-postgres@127.0.0.1:5432/pythagoras_ci
      STATIC_ROOT: /tmp/pythagoras-ci-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check
      - name: Fresh PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Reject missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file "$RUNNER_TEMP/schema.yaml"
      - name: Production configuration and static build
        env:
          DEBUG: 'false'
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
      - name: Complete Django suite on PostgreSQL
        run: python manage.py test --noinput
