databases:
  - name: pythagoras_db
    plan: free
    databaseName: pythagoras
    user: pythagoras_user

services:
  - type: web
    plan: free
    name: pythagoras
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn pythagoras.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pythagoras_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
